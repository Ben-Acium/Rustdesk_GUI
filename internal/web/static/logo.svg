<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="Rust Control Center">
  <title>Rust Control Center</title>
  <defs>
    <!-- userSpaceOnUse so the plate and the skull-shaped occluder below share
         one gradient, and the punched-out sockets match the plate exactly. -->
    <linearGradient id="rcc-plate" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="64">
      <stop offset="0" stop-color="#202b3b"/>
      <stop offset="1" stop-color="#0b0f16"/>
    </linearGradient>

    <!-- One bone, centred on the origin and lying horizontally. -->
    <g id="rcc-bone">
      <rect x="-26" y="-3.1" width="52" height="6.2" rx="3.1"/>
      <circle cx="-26" cy="-4.1" r="4.3"/>
      <circle cx="-26" cy="4.1" r="4.3"/>
      <circle cx="26" cy="-4.1" r="4.3"/>
      <circle cx="26" cy="4.1" r="4.3"/>
    </g>

    <path id="rcc-skull" d="M14 25a18 18 0 0 1 36 0v9a6 6 0 0 1-2.6 4.9l-1.6 1.1a4 4 0 0 0-1.8 3.3v1.2a2.5 2.5 0 0 1-2.5 2.5h-19a2.5 2.5 0 0 1-2.5-2.5v-1.2a4 4 0 0 0-1.8-3.3l-1.6-1.1A6 6 0 0 1 14 34z"/>

    <!-- Eye sockets, nose and tooth gaps, in the skull's own coordinates. -->
    <mask id="rcc-face" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff"/>
      <g fill="#000">
        <ellipse cx="24.3" cy="25.5" rx="5.6" ry="6.2" transform="rotate(-12 24.3 25.5)"/>
        <ellipse cx="39.7" cy="25.5" rx="5.6" ry="6.2" transform="rotate(12 39.7 25.5)"/>
        <path d="M32 29.5l4.2 7.2a1.6 1.6 0 0 1-1.4 2.4h-5.6a1.6 1.6 0 0 1-1.4-2.4z"/>
        <rect x="20.3" y="40.6" width="23.4" height="1.4" rx=".7"/>
        <rect x="23.85" y="41" width="1.9" height="6.6" rx=".95"/>
        <rect x="28.65" y="41" width="1.9" height="6.6" rx=".95"/>
        <rect x="33.45" y="41" width="1.9" height="6.6" rx=".95"/>
        <rect x="38.25" y="41" width="1.9" height="6.6" rx=".95"/>
      </g>
    </mask>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#rcc-plate)"/>

  <g fill="#8fa3c0">
    <use href="#rcc-bone" transform="translate(32 30) rotate(42)"/>
    <use href="#rcc-bone" transform="translate(32 30) rotate(-42)"/>
  </g>

  <!-- The skull occludes the bones twice: once opaquely in the plate colour, so
       the sockets read as holes in the plate rather than windows onto a bone. -->
  <g transform="translate(32 28) scale(.76) translate(-32 -27)">
    <use href="#rcc-skull" fill="url(#rcc-plate)"/>
    <g mask="url(#rcc-face)"><use href="#rcc-skull" fill="#f3f7fd"/></g>
  </g>
</svg>
